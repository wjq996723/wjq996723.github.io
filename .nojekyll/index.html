<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#163e4a">
  <title>云跃奇境</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-app" aria-label="云跃奇境游戏">
    <section class="game-shell">
      <canvas id="gameCanvas" width="420" height="760" aria-label="游戏画面"></canvas>

      <header class="topbar">
        <div class="brand" aria-label="云跃奇境">
          <span class="brand-mark">Y</span>
          <span>云跃奇境</span>
        </div>
        <div class="top-actions">
          <button id="soundButton" class="icon-button" type="button" aria-label="关闭音效" title="音效">♪</button>
          <button id="pauseButton" class="icon-button" type="button" aria-label="暂停游戏" title="暂停">Ⅱ</button>
        </div>
      </header>

      <section class="hud" aria-label="游戏状态">
        <div id="heartDisplay" class="hearts" aria-label="生命值"></div>
        <div class="level-chip"><span id="levelNumber">1</span><small>/ 8</small></div>
        <div class="coin-chip"><span class="coin-dot"></span><strong id="coinCount">0</strong></div>
      </section>

      <div class="progress-track" aria-hidden="true"><span id="progressBar"></span></div>

      <section id="menuPanel" class="panel menu-panel is-visible" aria-labelledby="gameTitle">
        <div class="menu-art" aria-hidden="true">
          <img src="assets/hero.svg" alt="">
          <div class="journey-line"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
          <img src="assets/princess.svg" alt="">
        </div>
        <p class="eyebrow">八重云境</p>
        <h1 id="gameTitle">云跃奇境</h1>
        <p class="story-line">穿过风暴，救出星羽公主</p>
        <button id="startButton" class="primary-button" type="button">开始冒险 <span>›</span></button>
        <button id="continueButton" class="secondary-button is-hidden" type="button">继续第 <span id="savedLevel">1</span> 关</button>
      </section>

      <section id="messagePanel" class="panel result-panel" aria-live="polite">
        <p id="resultEyebrow" class="eyebrow">云层已突破</p>
        <h2 id="resultTitle">第一关完成</h2>
        <div class="result-stats">
          <div><span class="coin-dot"></span><strong id="resultCoins">0</strong></div>
          <div><span>★</span><strong id="resultScore">0</strong></div>
        </div>
        <button id="nextButton" class="primary-button" type="button">下一关 <span>›</span></button>
        <button id="retryButton" class="primary-button is-hidden" type="button">再试一次 <span>↻</span></button>
        <button id="homeButton" class="secondary-button" type="button">返回云港</button>
      </section>

      <section id="pausePanel" class="pause-panel" aria-live="polite">
        <h2>旅程暂停</h2>
        <button id="resumeButton" class="primary-button" type="button">继续</button>
      </section>

      <div class="touch-controls" aria-label="移动控制">
        <button id="leftButton" type="button" aria-label="向左上跳">↖</button>
        <button id="jumpButton" class="jump-button" type="button" aria-label="向上跳">↑</button>
        <button id="rightButton" type="button" aria-label="向右上跳">↗</button>
      </div>
    </section>
  </main>
  <script src="game.js"></script>
</body>
</html>
