<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>小米的世界 - 失落的皇冠</title>
<style>
  body {
    margin: 0;
    background: linear-gradient(180deg, #ffd6e8 0%, #c9f2ff 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI', 'PingFang SC', sans-serif;
    color: #4a3b6b;
  }
  #card {
    background: #fff;
    border-radius: 28px;
    padding: 22px 22px 28px;
    box-shadow: 0 12px 30px rgba(120,80,160,0.25);
  }
  #screen-frame {
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 0 0 6px #ffe27a, 0 0 0 10px #ff9ecb;
  }
  canvas {
    display: block;
    image-rendering: auto;
  }
  #hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
    font-weight: 700;
    padding: 6px 4px 10px;
  }
  #lives { color: #ff5d8f; }
  #stage { color: #7a5cff; }
  #msg {
    text-align: center;
    font-size: 13px;
    color: #6b5b95;
    margin-top: 12px;
    min-height: 34px;
    line-height: 1.5;
    font-weight: 600;
  }
  #controls {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 14px;
  }
  .btn {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: linear-gradient(180deg,#ffe27a,#ffb84d);
    border: none;
    color: #7a4b00;
    font-size: 20px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    touch-action: manipulation;
    box-shadow: 0 4px 0 #d98c1f;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #d98c1f; }
  #jumpBtn { width: 80px; border-radius: 26px; font-size: 14px; background: linear-gradient(180deg,#a8f0c6,#5fd98f); color: #17603c; box-shadow: 0 4px 0 #2f9c63; }
  #jumpBtn:active { box-shadow: 0 1px 0 #2f9c63; }
  h1 { font-size: 16px; letter-spacing: 1px; margin: 0 0 10px; text-align: center; color: #7a5cff; font-weight: 800; }
</style>
</head>
<body>
<h1>🌈 小米的世界：失落的皇冠 👑</h1>
<div id="card">
  <div id="hud">
    <span id="lives">❤️❤️❤️</span>
    <span id="stage">关卡 1 / 3</span>
  </div>
  <div id="screen-frame">
    <canvas id="game" width="320" height="200"></canvas>
  </div>
  <div id="msg">方向键移动 · 空格/上跳跃 · 靠近笼子放鸟解锁道路</div>
  <div id="controls">
    <button class="btn" id="leftBtn">◀</button>
    <button class="btn" id="jumpBtn">跳!</button>
    <button class="btn" id="rightBtn">▶</button>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const GROUND_Y = 168;

let keys = {};
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (['ArrowUp','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
});
document.addEventListener('keyup', e => keys[e.key] = false);

function bindHold(el, onDown, onUp) {
  el.addEventListener('mousedown', onDown);
  el.addEventListener('touchstart', e => { e.preventDefault(); onDown(); });
  el.addEventListener('mouseup', onUp);
  el.addEventListener('mouseleave', onUp);
  el.addEventListener('touchend', e => { e.preventDefault(); onUp(); });
}
bindHold(document.getElementById('leftBtn'), () => keys['ArrowLeft']=true, () => keys['ArrowLeft']=false);
bindHold(document.getElementById('rightBtn'), () => keys['ArrowRight']=true, () => keys['ArrowRight']=false);
bindHold(document.getElementById('jumpBtn'), () => keys[' ']=true, () => keys[' ']=false);

let stageIndex = 0;
let lives = 3;
let gameOver = false;
let msgTimer = 0;
let particles = [];
let walkCycle = 0;

function setMsg(text) { document.getElementById('msg').textContent = text; }

function buildStage(n) {
  if (n === 0) {
    return {
      platforms: [
        {x:0,y:GROUND_Y,w:320,h:32},
        {x:120,y:130,w:56,h:10},
      ],
      cage: {x:140, y:104, w:20, h:20, opened:false},
      door: {x:270, y:GROUND_Y-40, w:18, h:40, open:false},
      enemies: [ {x:200,y:GROUND_Y-16,w:16,h:16,dir:1,range:[170,250],speed:0.7,color:'#ff8a5c'} ],
      goal: {x:296, y:GROUND_Y-20, w:16, h:20},
      chase: false,
      playerStart: {x:16,y:GROUND_Y-22}
    };
  }
  if (n === 1) {
    return {
      platforms: [ {x:0,y:GROUND_Y,w:320,h:32} ],
      cage: null, door: null, enemies: [],
      goal: {x:296, y:GROUND_Y-20, w:16, h:20},
      chase: true,
      chaser: {x:-40,y:GROUND_Y-24,w:20,h:22,speed:1.25},
      playerStart: {x:16,y:GROUND_Y-22}
    };
  }
  return {
    platforms: [
      {x:0,y:GROUND_Y,w:320,h:32},
      {x:80,y:135,w:40,h:10},
      {x:200,y:105,w:40,h:10},
    ],
    cage: {x:80, y:105, w:18, h:18, opened:false},
    door: {x:280, y:GROUND_Y-50, w:18, h:50, open:false},
    enemies: [
      {x:130,y:GROUND_Y-16,w:16,h:16,dir:1,range:[100,180],speed:0.8,color:'#7ad1ff'},
      {x:225,y:85,w:16,h:16,dir:-1,range:[200,250],speed:1.0,color:'#c893ff'}
    ],
    goal: {x:298, y:GROUND_Y-20, w:16, h:20},
    chase: false,
    playerStart: {x:16,y:GROUND_Y-22}
  };
}

let stage = buildStage(0);
let player = { x: stage.playerStart.x, y: stage.playerStart.y, w:18, h:22, vx:0, vy:0, onGround:false, facing:1 };

function resetStage() {
  stage = buildStage(stageIndex);
  player.x = stage.playerStart.x;
  player.y = stage.playerStart.y;
  player.vx = 0; player.vy = 0;
}

function rectsOverlap(a,b) {
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

function spawnParticles(x,y,color,count) {
  for (let i=0;i<count;i++) {
    particles.push({x, y, vx:(Math.random()-0.5)*3, vy:-Math.random()*3, life:30, color});
  }
}

const GRAVITY = 0.45;
const MOVE_SPEED = 1.8;
const JUMP_V = -7.4;

function update() {
  if (gameOver) return;

  if (keys['ArrowLeft']) { player.vx = -MOVE_SPEED; player.facing = -1; walkCycle++; }
  else if (keys['ArrowRight']) { player.vx = MOVE_SPEED; player.facing = 1; walkCycle++; }
  else player.vx = 0;

  if ((keys[' '] || keys['ArrowUp']) && player.onGround) {
    player.vy = JUMP_V;
    player.onGround = false;
    spawnParticles(player.x+player.w/2, player.y+player.h, '#fff', 6);
  }

  player.vy += GRAVITY;
  player.x += player.vx;
  player.y += player.vy;

  player.onGround = false;
  for (const p of stage.platforms) {
    if (player.x+player.w > p.x && player.x < p.x+p.w) {
      if (player.y+player.h > p.y && player.y+player.h - player.vy <= p.y+1 && player.vy >= 0) {
        player.y = p.y - player.h;
        player.vy = 0;
        player.onGround = true;
      }
    }
  }
  if (stage.door && !stage.door.open) {
    const d = stage.door;
    if (rectsOverlap({x:player.x,y:player.y,w:player.w,h:player.h}, d)) {
      if (player.vx > 0) player.x = d.x - player.w;
      else if (player.vx < 0) player.x = d.x + d.w;
    }
  }

  player.x = Math.max(0, Math.min(W - player.w, player.x));
  if (player.y > H) hitPlayer();

  if (stage.cage && !stage.cage.opened) {
    if (rectsOverlap({x:player.x,y:player.y,w:player.w,h:player.h}, stage.cage)) {
      stage.cage.opened = true;
      if (stage.door) stage.door.open = true;
      spawnParticles(stage.cage.x+stage.cage.w/2, stage.cage.y, '#ffe27a', 14);
      setMsg('小鸟飞走啦！门开了，快往前走！ 🐦');
    }
  }

  for (const e of stage.enemies) {
    e.x += e.dir * e.speed;
    if (e.x < e.range[0] || e.x > e.range[1]) e.dir *= -1;
    if (rectsOverlap({x:player.x,y:player.y,w:player.w,h:player.h}, e)) hitPlayer();
  }

  if (stage.chase) {
    stage.chaser.x += stage.chaser.speed;
    if (rectsOverlap({x:player.x,y:player.y,w:player.w,h:player.h}, stage.chaser)) hitPlayer(true);
  }

  if (rectsOverlap({x:player.x,y:player.y,w:player.w,h:player.h}, stage.goal)) nextStage();

  particles = particles.filter(p => p.life > 0);
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.life--; }
}

function hitPlayer() {
  lives -= 1;
  document.getElementById('lives').textContent = '❤️'.repeat(Math.max(lives,0)) + '🤍'.repeat(3-Math.max(lives,0));
  if (lives <= 0) {
    gameOver = true;
    setMsg('游戏结束啦！按 R 键重新开始 🔄');
    return;
  }
  setMsg('哎呀，小心点！');
  resetStage();
}

function nextStage() {
  stageIndex++;
  if (stageIndex >= 3) {
    gameOver = true;
    setMsg('🎉 恭喜！你找回了失落的皇冠！通关啦！ 👑');
    return;
  }
  document.getElementById('stage').textContent = '关卡 ' + (stageIndex+1) + ' / 3';
  setMsg(stageIndex === 1 ? '追逐战！一直向右跑，别被追上！ 🏃' : '继续前进，寻找皇冠！ ✨');
  resetStage();
}

document.addEventListener('keydown', e => {
  if ((e.key === 'r' || e.key === 'R') && gameOver) {
    stageIndex = 0; lives = 3; gameOver = false;
    document.getElementById('lives').textContent = '❤️❤️❤️';
    document.getElementById('stage').textContent = '关卡 1 / 3';
    setMsg('方向键移动 · 空格/上跳跃 · 靠近笼子放鸟解锁道路');
    resetStage();
  }
});

function roundRect(x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawBackground() {
  const sky = ctx.createLinearGradient(0,0,0,GROUND_Y);
  sky.addColorStop(0, '#7ec8ff');
  sky.addColorStop(1, '#cdeeff');
  ctx.fillStyle = sky;
  ctx.fillRect(0,0,W,GROUND_Y);

  ctx.fillStyle = '#fff8b0';
  ctx.beginPath(); ctx.arc(288,28,18,0,Math.PI*2); ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  drawCloud(50,30); drawCloud(150,50); drawCloud(230,25);

  ctx.fillStyle = '#8de37a';
  ctx.fillRect(0,GROUND_Y,W,H-GROUND_Y);
  ctx.fillStyle = '#6fcf5e';
  for (let x=0;x<W;x+=16) {
    ctx.beginPath();
    ctx.moveTo(x,GROUND_Y);
    ctx.lineTo(x+8,GROUND_Y-8);
    ctx.lineTo(x+16,GROUND_Y);
    ctx.fill();
  }
}

function drawCloud(cx,cy) {
  ctx.beginPath();
  ctx.arc(cx,cy,10,0,Math.PI*2);
  ctx.arc(cx+12,cy-4,12,0,Math.PI*2);
  ctx.arc(cx+24,cy,10,0,Math.PI*2);
  ctx.fill();
}

function drawPlatforms() {
  for (const p of stage.platforms) {
    if (p.y === GROUND_Y) continue;
    ctx.fillStyle = '#f6b26b';
    roundRect(p.x,p.y,p.w,p.h,4); ctx.fill();
    ctx.fillStyle = '#8de37a';
    roundRect(p.x,p.y,p.w,4,4); ctx.fill();
  }
}

function drawCage() {
  if (!stage.cage || stage.cage.opened) return;
  const c = stage.cage;
  ctx.strokeStyle = '#c98b3f';
  ctx.lineWidth = 2;
  roundRect(c.x,c.y,c.w,c.h,4); ctx.stroke();
  for (let i=0;i<=c.w;i+=6) {
    ctx.beginPath(); ctx.moveTo(c.x+i,c.y); ctx.lineTo(c.x+i,c.y+c.h); ctx.stroke();
  }
  ctx.fillStyle = '#ffd23f';
  ctx.beginPath(); ctx.arc(c.x+c.w/2, c.y+c.h/2, 5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ff8a5c';
  ctx.beginPath(); ctx.moveTo(c.x+c.w/2+4,c.y+c.h/2); ctx.lineTo(c.x+c.w/2+9,c.y+c.h/2-2); ctx.lineTo(c.x+c.w/2+9,c.y+c.h/2+2); ctx.fill();
}

function drawDoor() {
  if (!stage.door || stage.door.open) return;
  const d = stage.door;
  ctx.fillStyle = '#a4682f';
  roundRect(d.x,d.y,d.w,d.h,3); ctx.fill();
  ctx.fillStyle = '#ffd23f';
  ctx.beginPath(); ctx.arc(d.x+d.w-5, d.y+d.h/2, 2, 0, Math.PI*2); ctx.fill();
}

function drawEnemies() {
  for (const e of stage.enemies) {
    ctx.fillStyle = e.color;
    ctx.beginPath(); ctx.arc(e.x+e.w/2, e.y+e.h/2, e.w/2, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#3a3350';
    ctx.beginPath(); ctx.arc(e.x+e.w/2-4, e.y+e.h/2-2, 1.6, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(e.x+e.w/2+4, e.y+e.h/2-2, 1.6, 0, Math.PI*2); ctx.fill();
  }
  if (stage.chase) {
    const c = stage.chaser;
    ctx.fillStyle = '#ff5d8f';
    roundRect(c.x, c.y, c.w, c.h, 6); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(c.x+6, c.y+7, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(c.x+14, c.y+7, 3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#3a3350';
    ctx.beginPath(); ctx.arc(c.x+7, c.y+7, 1.4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(c.x+15, c.y+7, 1.4, 0, Math.PI*2); ctx.fill();
  }
}

function drawGoal() {
  const g = stage.goal;
  const bob = Math.sin(Date.now()/200) * 2;
  ctx.fillStyle = '#ffd23f';
  ctx.beginPath();
  ctx.moveTo(g.x, g.y+g.h+bob);
  ctx.lineTo(g.x, g.y+6+bob);
  ctx.lineTo(g.x+4, g.y+12+bob);
  ctx.lineTo(g.x+g.w/2, g.y+bob);
  ctx.lineTo(g.x+g.w-4, g.y+12+bob);
  ctx.lineTo(g.x+g.w, g.y+6+bob);
  ctx.lineTo(g.x+g.w, g.y+g.h+bob);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#c98b1f';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.fillStyle = '#ff5d8f';
  ctx.beginPath(); ctx.arc(g.x+g.w/2, g.y+bob, 2, 0, Math.PI*2); ctx.fill();
}

function drawPlayer() {
  const px = player.x, py = player.y;
  const bob = player.onGround && Math.abs(player.vx) > 0 ? Math.sin(walkCycle*0.5)*1.5 : 0;
  ctx.save();
  ctx.translate(px + player.w/2, 0);
  ctx.scale(player.facing, 1);
  ctx.translate(-player.w/2, 0);

  ctx.fillStyle = '#ff9ecb';
  ctx.beginPath(); ctx.arc(3, py+3, 4, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(15, py+3, 4, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = '#ff8a5c';
  roundRect(0, py+2+bob, 18, 14, 6); ctx.fill();

  ctx.fillStyle = '#fff3d9';
  roundRect(3, py+8+bob, 12, 8, 4); ctx.fill();

  ctx.fillStyle = '#3a3350';
  ctx.beginPath(); ctx.arc(6, py+7+bob, 1.6, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(12, py+7+bob, 1.6, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = '#c9502f';
  ctx.beginPath(); ctx.arc(9, py+11+bob, 2, 0, Math.PI); ctx.fill();

  ctx.fillStyle = '#ff8a5c';
  ctx.fillRect(3, py+16+bob, 4, 6);
  ctx.fillRect(11, py+16+bob, 4, 6);
  ctx.fillStyle = '#3a3350';
  ctx.fillRect(2, py+21+bob, 6, 3);
  ctx.fillRect(10, py+21+bob, 6, 3);

  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life/30;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,2,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function draw() {
  drawBackground();
  drawPlatforms();
  drawCage();
  drawDoor();
  drawEnemies();
  drawGoal();
  drawPlayer();
  drawParticles();

  if (gameOver) {
    ctx.fillStyle = 'rgba(60,40,80,0.35)';
    ctx.fillRect(0,0,W,H);
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
