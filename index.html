<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日生活助手</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --bg-dark: #1a1a2e;
    --bg-card: #16213e;
    --bg-sidebar: #0f3460;
    --accent-green: #4ade80;
    --accent-blue: #60a5fa;
    --accent-purple: #a78bfa;
    --accent-pink: #f472b6;
    --accent-orange: #fb923c;
    --accent-yellow: #fbbf24;
    --accent-red: #f87171;
    --accent-teal: #2dd4bf;
    --text-primary: #e2e8f0;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --border-color: #334155;
    --hover-bg: #1e293b;
    --shadow: 0 4px 20px rgba(0,0,0,0.3);
    --radius: 12px;
    --radius-lg: 16px;
    --transition: all 0.3s ease;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg-dark);
    color: var(--text-primary);
    height: 100vh;
    overflow: hidden;
    display: flex;
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ===== 侧边栏 ===== */
.sidebar {
    width: 240px;
    min-width: 240px;
    background: linear-gradient(180deg, #0f172a 0%, #1a1a2e 100%);
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border-color);
    overflow-y: auto;
}
.sidebar-header {
    padding: 28px 20px 20px;
    border-bottom: 1px solid var(--border-color);
}
.sidebar-header h1 {
    font-size: 20px;
    background: linear-gradient(135deg, var(--accent-green), var(--accent-teal));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 4px;
}
.sidebar-header p {
    font-size: 12px;
    color: var(--text-muted);
}
.nav-menu {
    flex: 1;
    padding: 12px 10px;
}
.nav-item {
    display: flex;
    align-items: center;
    padding: 12px 14px;
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 4px;
    transition: var(--transition);
    position: relative;
    font-size: 14px;
    color: var(--text-secondary);
}
.nav-item:hover {
    background: var(--hover-bg);
    color: var(--text-primary);
}
.nav-item.active {
    background: rgba(74, 222, 128, 0.12);
    color: var(--accent-green);
    font-weight: 600;
}
.nav-item.active::before {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 60%;
    background: var(--accent-green);
    border-radius: 0 3px 3px 0;
}
.nav-icon { font-size: 18px; margin-right: 12px; }
.nav-text { flex: 1; }
.nav-badge {
    background: var(--accent-red);
    color: #fff;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 10px;
}
.sidebar-footer {
    padding: 16px 20px;
    border-top: 1px solid var(--border-color);
    font-size: 12px;
    color: var(--text-muted);
    text-align: center;
}

/* ===== 主内容区 ===== */
.main-content {
    flex: 1;
    overflow-y: auto;
    padding: 28px 32px;
}
.page-header {
    margin-bottom: 24px;
}
.page-header h2 {
    font-size: 24px;
    margin-bottom: 6px;
}
.page-header p {
    font-size: 13px;
    color: var(--text-muted);
}

/* ===== 卡片 ===== */
.card {
    background: var(--bg-card);
    border-radius: var(--radius-lg);
    padding: 22px;
    margin-bottom: 18px;
    border: 1px solid var(--border-color);
    box-shadow: var(--shadow);
}
.card-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    color: var(--text-primary);
}

/* ===== 统计卡片 ===== */
.stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 14px;
    margin-bottom: 18px;
}
.stat-card {
    background: var(--bg-card);
    border-radius: var(--radius);
    padding: 18px;
    text-align: center;
    border: 1px solid var(--border-color);
}
.stat-value {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 4px;
}
.stat-label {
    font-size: 12px;
    color: var(--text-muted);
}

/* ===== 子标签 ===== */
.sub-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 18px;
}
.sub-tab {
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    background: var(--bg-card);
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 13px;
    transition: var(--transition);
}
.sub-tab:hover { background: var(--hover-bg); }
.sub-tab.active {
    background: var(--accent-green);
    color: #0f172a;
    font-weight: 600;
    border-color: var(--accent-green);
}
.sub-panel { display: none; }
.sub-panel.active { display: block; animation: fadeIn 0.3s ease; }

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}

/* ===== 待办 ===== */
.todo-item {
    display: flex;
    align-items: center;
    padding: 12px 14px;
    border-radius: 10px;
    margin-bottom: 6px;
    background: var(--hover-bg);
    transition: var(--transition);
}
.todo-item.completed .todo-text {
    text-decoration: line-through;
    color: var(--text-muted);
}
.todo-checkbox {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--border-color);
    margin-right: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
    flex-shrink: 0;
}
.todo-checkbox:hover { border-color: var(--accent-green); }
.todo-checkbox.checked {
    background: var(--accent-green);
    border-color: var(--accent-green);
}
.todo-checkbox.checked::after {
    content: '✓';
    color: #0f172a;
    font-size: 13px;
    font-weight: 700;
}
.todo-text { flex: 1; font-size: 14px; }
.todo-delete {
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 18px;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 4px;
    opacity: 0;
    transition: var(--transition);
}
.todo-item:hover .todo-delete { opacity: 1; }
.todo-delete:hover { background: rgba(248,113,113,0.2); color: var(--accent-red); }
.todo-priority {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    margin-right: 8px;
    font-weight: 600;
}
.priority-high { background: rgba(248,113,113,0.2); color: var(--accent-red); }
.priority-mid { background: rgba(251,146,60,0.2); color: var(--accent-orange); }
.priority-low { background: rgba(100,116,139,0.2); color: var(--text-muted); }

.add-todo-row {
    display: flex;
    gap: 8px;
    margin-top: 14px;
}
.add-todo-row input {
    flex: 1;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    background: var(--hover-bg);
    color: var(--text-primary);
    font-size: 14px;
    outline: none;
}
.add-todo-row input:focus { border-color: var(--accent-green); }
.add-todo-row select {
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    background: var(--hover-bg);
    color: var(--text-primary);
    font-size: 13px;
    outline: none;
}

/* ===== 按钮 ===== */
.btn-add {
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    background: var(--accent-green);
    color: #0f172a;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
    white-space: nowrap;
}
.btn-add:hover { filter: brightness(1.1); transform: translateY(-1px); }
.btn-cancel {
    padding: 10px 18px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    background: transparent;
    color: var(--text-secondary);
    font-size: 13px;
    cursor: pointer;
}
.btn-confirm {
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    background: var(--accent-green);
    color: #0f172a;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
}

/* ===== 进度条 ===== */
.progress-bar {
    height: 8px;
    background: var(--hover-bg);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 16px;
}
.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent-green), var(--accent-teal));
    border-radius: 4px;
    transition: width 0.5s ease;
}

/* ===== 喝水 ===== */
.water-progress {
    display: flex;
    justify-content: center;
    margin: 20px 0;
}
.water-circle {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    background: conic-gradient(var(--accent-blue) calc(var(--progress) * 1%), var(--hover-bg) 0);
    display: flex;
    align-items: center;
    justify-content: center;
}
.water-circle-inner {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: var(--bg-card);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}
.water-amount { font-size: 26px; font-weight: 700; color: var(--accent-blue); }
.water-label { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.water-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 20px;
}
.water-stat { text-align: center; }
.water-stat-value { font-size: 20px; font-weight: 700; }
.water-stat-label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.water-list {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
    gap: 10px;
}
.water-item {
    text-align: center;
    padding: 14px 10px;
    border-radius: 10px;
    background: var(--hover-bg);
    cursor: pointer;
    transition: var(--transition);
}
.water-item:hover { background: #243349; }
.water-item.done {
    background: rgba(74,222,128,0.12);
    border: 1px solid rgba(74,222,128,0.3);
}
.water-cup-icon { font-size: 28px; margin-bottom: 4px; }
.water-time { font-size: 13px; font-weight: 600; }
.water-ml { font-size: 11px; color: var(--text-muted); }

/* ===== 吃药 ===== */
.medicine-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 16px;
}
.medicine-card {
    text-align: center;
    padding: 20px 14px;
    border-radius: 12px;
    background: var(--hover-bg);
    cursor: pointer;
    transition: var(--transition);
    border: 2px solid transparent;
}
.medicine-card:hover { transform: translateY(-2px); }
.medicine-card.taken {
    background: rgba(74,222,128,0.1);
    border-color: var(--accent-green);
}
.medicine-icon { font-size: 36px; margin-bottom: 8px; }
.medicine-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.medicine-desc { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }
.medicine-streak { font-size: 12px; color: var(--accent-orange); }
.add-medicine {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}
.add-medicine input {
    flex: 1;
    min-width: 140px;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    background: var(--hover-bg);
    color: var(--text-primary);
    font-size: 13px;
    outline: none;
}

/* ===== 日历 ===== */
.period-calendar, .study-calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    margin: 16px 0;
}
.cal-header {
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    padding: 6px 0;
    font-weight: 600;
}
.cal-day, .study-cal-day {
    text-align: center;
    padding: 8px 4px;
    border-radius: 6px;
    font-size: 13px;
    cursor: default;
    min-height: 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}
.cal-day.empty, .study-cal-day.empty { visibility: hidden; }
.cal-day.today, .study-cal-day.today {
    border: 2px solid var(--accent-blue);
    font-weight: 700;
}
.cal-day.period {
    background: rgba(244,114,182,0.2);
    color: var(--accent-pink);
    font-weight: 600;
}
.cal-day.period-start {
    background: var(--accent-pink);
    color: #fff;
}
.cal-day.predicted {
    background: rgba(167,139,250,0.15);
    color: var(--accent-purple);
    border: 1px dashed var(--accent-purple);
}
.cal-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-bottom: 8px;
}
.cal-nav button {
    background: var(--hover-bg);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    width: 32px;
    height: 32px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
}
.cal-month { font-size: 15px; font-weight: 600; }
.period-info {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-top: 16px;
}
.period-info-item { text-align: center; }
.period-info-value { font-size: 18px; font-weight: 700; color: var(--accent-pink); }
.period-info-label { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.period-form {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
}
.period-form label {
    display: block;
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 4px;
}
.period-form input, .period-form textarea {
    width: 100%;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    background: var(--hover-bg);
    color: var(--text-primary);
    font-size: 13px;
    outline: none;
}
.period-form textarea { resize: vertical; min-height: 60px; }

/* ===== 养生 ===== */
.health-card {
    padding: 18px;
    border-radius: 12px;
    background: var(--hover-bg);
    margin-bottom: 12px;
    cursor: pointer;
    transition: var(--transition);
    border: 1px solid transparent;
}
.health-card:hover { border-color: var(--accent-green); transform: translateY(-1px); }
.health-tag {
    display: inline-block;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 10px;
    background: rgba(74,222,128,0.15);
    color: var(--accent-green);
    margin-bottom: 8px;
}
.health-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
.health-content { font-size: 13px; color: var(--text-secondary); line-height: 1.7; }
.health-actions { display: flex; gap: 10px; margin-top: 14px; }
.btn-favorite, .btn-note {
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    background: var(--hover-bg);
    color: var(--text-primary);
    font-size: 13px;
    cursor: pointer;
    transition: var(--transition);
}
.btn-favorite.active { background: rgba(244,114,182,0.15); border-color: var(--accent-pink); color: var(--accent-pink); }

/* ===== 备忘录 ===== */
.memo-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 14px;
}
.memo-card {
    background: var(--hover-bg);
    border-radius: 12px;
    padding: 18px;
    cursor: pointer;
    transition: var(--transition);
    position: relative;
    border: 1px solid transparent;
}
.memo-card:hover { border-color: var(--accent-blue); transform: translateY(-2px); }
.memo-card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}
.memo-card-title { font-size: 14px; font-weight: 600; }
.memo-card-date { font-size: 11px; color: var(--text-muted); }
.memo-card-content {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
.memo-card-delete {
    position: absolute;
    top: 8px;
    right: 8px;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 18px;
    cursor: pointer;
    opacity: 0;
    transition: var(--transition);
}
.memo-card:hover .memo-card-delete { opacity: 1; }
.memo-card-delete:hover { color: var(--accent-red); }
.add-memo-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px;
    border: 2px dashed var(--border-color);
    border-radius: 12px;
    cursor: pointer;
    transition: var(--transition);
    color: var(--text-muted);
    min-height: 120px;
}
.add-memo-btn:hover { border-color: var(--accent-green); color: var(--accent-green); }
.plus-icon { font-size: 32px; margin-bottom: 6px; }

/* ===== 记账 ===== */
.account-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
}
.account-tab {
    padding: 10px 24px;
    border-radius: 10px;
    border: 1px solid var(--border-color);
    background: var(--bg-card);
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: var(--transition);
}
.account-tab.active {
    background: var(--accent-green);
    color: #0f172a;
    border-color: var(--accent-green);
}
.account-form {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr auto;
    gap: 10px;
    align-items: center;
}
.account-form input, .account-form select {
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    background: var(--hover-bg);
    color: var(--text-primary);
    font-size: 14px;
    outline: none;
}
.account-list { margin-top: 8px; }
.account-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    border-radius: 10px;
    margin-bottom: 6px;
    background: var(--hover-bg);
}
.account-item-info { display: flex; align-items: center; gap: 12px; }
.account-item-icon { font-size: 22px; }
.account-item-name { font-size: 14px; font-weight: 500; }
.account-item-category { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.account-item-amount { font-size: 15px; font-weight: 700; }
.account-item-amount.expense { color: var(--accent-red); }
.account-item-amount.income { color: var(--accent-green); }

/* ===== 存钱 ===== */
.savings-goal {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 10px 0 20px;
}
.savings-circle {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    background: conic-gradient(var(--accent-yellow) calc(var(--savings-progress) * 1%), var(--hover-bg) 0);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 14px;
}
.savings-circle-inner {
    width: 146px;
    height: 146px;
    border-radius: 50%;
    background: var(--bg-card);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}
.savings-amount { font-size: 24px; font-weight: 700; color: var(--accent-yellow); }
.savings-label { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.savings-form {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
}
.savings-form input {
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid var(--border-color);
    background: var(--hover-bg);
    color: var(--text-primary);
    font-size: 14px;
    outline: none;
    flex: 1;
    min-width: 120px;
}
.savings-item {
    display: flex;
    justify-content: space-between;
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 6px;
    background: var(--hover-bg);
}
.savings-item-date { font-size: 13px; color: var(--text-muted); }
.savings-item-amount { font-size: 14px; font-weight: 600; color: var(--accent-yellow); }

/* ===== 学习打卡 ===== */
.study-hero {
    text-align: center;
    padding: 30px 20px;
    background: linear-gradient(135deg, rgba(167,139,250,0.1), rgba(96,165,250,0.1));
    border-radius: var(--radius-lg);
    margin-bottom: 20px;
    border: 1px solid rgba(167,139,250,0.2);
}
.study-hero-icon { font-size: 48px; margin-bottom: 10px; }
.study-hero-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; }

// ========== 工具函数 ==========
function $(id) { return document.getElementById(id); }
function today() { return new Date().toISOString().slice(0,10); }
function todayDisplay() { return new Date().toLocaleDateString('zh-CN', { year:'numeric', month:'long', day:'numeric', weekday:'long' }); }

function showToast(msg, type) {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'toast show' + (type === 'error' ? ' error' : '');
    setTimeout(() => { t.className = 'toast'; }, 2500);
}

function formatMoney(n) {
    return Number(n).toLocaleString('zh-CN', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}

function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

// ========== localStorage 持久化 ==========
const STORAGE_KEY = 'lifeAssistantState_v1';

function loadState() {
    try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            const parsed = JSON.parse(saved);
            Object.assign(state, parsed);
        }
    } catch(e) { /* 忽略 */ }
}

function saveState() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch(e) { /* 忽略 */ }
}

// ========== 导航渲染 ==========
function renderNav() {
    const menu = $('navMenu');
    menu.innerHTML = navItems.map(item => `
        <div class="nav-item ${state.currentPage === item.id ? 'active' : ''}" data-id="${item.id}">
            <span class="nav-icon">${item.icon}</span>
            <span class="nav-text">${item.text}</span>
        </div>
    `).join('');

    menu.querySelectorAll('.nav-item').forEach(el => {
        el.addEventListener('click', () => switchPage(el.dataset.id));
    });

    $('todayDate').textContent = todayDisplay();
}

function switchPage(pageId) {
    state.currentPage = pageId;
    renderNav();
    renderPage();
}

// ========== 页面渲染分发 ==========
function renderPage() {
    const main = $('mainContent');
    switch(state.currentPage) {
        case 'daily-plan': renderDailyPlan(main); break;
        case 'health': renderHealth(main); break;
        case 'memo': renderMemo(main); break;
        case 'fitness': renderFitness(main); break;
        case 'savings': renderSavings(main); break;
        case 'account': renderAccount(main); break;
        case 'review': renderReview(main); break;
        case 'study': renderStudy(main); break;
    }
    saveState();
}

// ========== 每日计划 ==========
function renderDailyPlan(container) {
    container.innerHTML = `
        <div class="page-header">
            <h2>📋 每日计划</h2>
            <p>规划每一天，让生活更有条理</p>
        </div>
        <div class="sub-tabs">
            <button class="sub-tab ${state.currentSubTab==='routine'?'active':''}" data-tab="routine">🏠 日常计划</button>
            <button class="sub-tab ${state.currentSubTab==='work'?'active':''}" data-tab="work">💼 工作计划</button>
            <button class="sub-tab ${state.currentSubTab==='water'?'active':''}" data-tab="water">💧 喝水提醒</button>
            <button class="sub-tab ${state.currentSubTab==='period'?'active':''}" data-tab="period">🌸 月经记录</button>
            <button class="sub-tab ${state.currentSubTab==='medicine'?'active':''}" data-tab="medicine">💊 吃药打卡</button>
        </div>
        <div class="sub-panel ${state.currentSubTab==='routine'?'active':''}">${renderRoutine()}</div>
        <div class="sub-panel ${state.currentSubTab==='work'?'active':''}">${renderWork()}</div>
        <div class="sub-panel ${state.currentSubTab==='water'?'active':''}">${renderWater()}</div>
        <div class="sub-panel ${state.currentSubTab==='period'?'active':''}">${renderPeriod()}</div>
        <div class="sub-panel ${state.currentSubTab==='medicine'?'active':''}">${renderMedicine()}</div>
    `;

    container.querySelectorAll('.sub-tab').forEach(btn => {
        btn.addEventListener('click', () => {
            state.currentSubTab = btn.dataset.tab;
            renderPage();
        });
    });
}

// --- 日常计划 ---
function renderRoutine() {
    const total = state.routineTodos.length;
    const done = state.routineTodos.filter(t => t.done).length;
    const pct = total ? Math.round(done/total*100) : 0;

    return `
        <div class="card">
            <div class="card-title">🏠 日常计划 <span style="font-size:12px;color:var(--text-muted);margin-left:auto;">${done}/${total} 已完成</span></div>
            <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
            ${state.routineTodos.map(t => `
                <div class="todo-item ${t.done?'completed':''}">
                    <div class="todo-checkbox ${t.done?'checked':''}" onclick="toggleRoutine(${t.id})"></div>
                    <span class="todo-text">${t.text}${t.fixed?' 🔒':''}</span>
                    ${t.fixed?'':`<button class="todo-delete" onclick="deleteRoutine(${t.id})">×</button>`}
                </div>
            `).join('')}
            <div class="add-todo-row">
                <input type="text" id="newRoutineInput" placeholder="添加自定义待办..." onkeydown="if(event.key==='Enter')addRoutine()">
                <button class="btn-add" onclick="addRoutine()">➕ 添加</button>
            </div>
        </div>
    `;
}

function toggleRoutine(id) {
    const t = state.routineTodos.find(x => x.id === id);
    if (t) { t.done = !t.done; renderPage(); }
}

function addRoutine() {
    const input = $('newRoutineInput');
    const text = input.value.trim();
    if (!text) return showToast('请输入待办内容', 'error');
    state.routineTodos.push({ id: Date.now(), text, done: false, fixed: false });
    input.value = '';
    renderPage();
    showToast('已添加待办 ✅');
}

function deleteRoutine(id) {
    state.routineTodos = state.routineTodos.filter(t => t.id !== id);
    renderPage();
}

// --- 工作计划 ---
function renderWork() {
    const total = state.workTodos.length;
    const done = state.workTodos.filter(t => t.done).length;

}

function toggleWork(id) {

function addWork() {

function deleteWork(id) {

// --- 喝水提醒 ---
function renderWater() {
    const todayKey = today();
    const done = state.waterHistory[todayKey] || 0;
    const consumed = done * state.waterPerTime;
    const remaining = Math.max(0, state.waterGoal - consumed);
    const pct = Math.min(100, Math.round(consumed / state.waterGoal * 100));

    const times = [];
    for (let i = 0; i < state.waterTimes; i++) {
        const hour = 8 + i * state.waterInterval;
        times.push({ idx: i, time: String(hour).padStart(2,'0') + ':00', done: i < done });
    }

    return `
        <div class="card">
            <div class="card-title">💧 喝水提醒（目标 ${state.waterGoal}ml）</div>
            <div class="water-progress">
                <div class="water-circle" style="--progress:${pct}">
                    <div class="water-circle-inner">
                        <div class="water-amount">${consumed}ml</div>
                        <div class="water-label">/ ${state.waterGoal}ml</div>
                    </div>
                </div>
            </div>
            <div class="water-stats">
                <div class="water-stat">
                    <div class="water-stat-value" style="color:var(--accent-green);">${done}</div>
                    <div class="water-stat-label">已完成次数</div>
                </div>
                <div class="water-stat">
                    <div class="water-stat-value" style="color:var(--accent-blue);">${consumed}ml</div>
                    <div class="water-stat-label">已饮水量</div>
                </div>
                <div class="water-stat">
                    <div class="water-stat-value" style="color:var(--accent-orange);">${remaining}ml</div>
                    <div class="water-stat-label">剩余</div>
                </div>
            </div>
            <div class="water-list">
                ${times.map(t => `
                    <div class="water-item ${t.done?'done':''}" onclick="drinkWater(${t.idx})">
                        <div class="water-cup-icon">${t.done?'🥤':'🥛'}</div>
                        <div class="water-time">${t.time}</div>
                        <div class="water-ml">${state.waterPerTime}ml</div>
                    </div>
                `).join('')}
            </div>
        </div>
        <div class="card">
            <div class="card-title">📅 喝水历史（最近7天）</div>
            ${renderWaterHistory()}
        </div>
    `;
}

function renderWaterHistory() {
    const days = [];
    for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const key = d.toISOString().slice(0,10);
        const count = state.waterHistory[key] || 0;
        days.push({ date: (d.getMonth()+1) + '/' + d.getDate(), count });
    }
    const max = Math.max(...days.map(d => d.count), 1);
    return `
        <div style="display:flex;align-items:flex-end;gap:12px;height:100px;padding:10px 0;">
            ${days.map(d => `
                <div style="flex:1;text-align:center;">
                    <div style="height:${d.count/max*80}px;background:${d.count>0?'var(--accent-blue)':'var(--hover-bg)'};border-radius:6px 6px 0 0;min-height:4px;transition:all 0.3s;"></div>
                    <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">${d.date}</div>
                    <div style="font-size:12px;color:var(--accent-blue);font-weight:600;">${d.count}×</div>
                </div>
            `).join('')}
        </div>
    `;
}

function drinkWater(idx) {
    const todayKey = today();
    const current = state.waterHistory[todayKey] || 0;
    if (idx <= current) {
        state.waterHistory[todayKey] = Math.max(0, current - 1);
    } else {
        state.waterHistory[todayKey] = idx + 1;
    }
    renderPage();
}

// --- 月经记录 ---
let calOffset = 0;

function renderPeriod() {
    const todayDate = new Date();
    const year = todayDate.getFullYear();
    const month = todayDate.getMonth() + calOffset;
    const displayYear = new Date(year, month, 1).getFullYear();
    const displayMonth = new Date(year, month, 1).getMonth();
    const daysInMonth = new Date(displayYear, displayMonth + 1, 0).getDate();
    const firstDay = new Date(displayYear, displayMonth, 1).getDay();

    const periodDays = getPeriodDays();
    const predictedDays = getPredictedPeriodDays();

    let calendar = '';
    ['日','一','二','三','四','五','六'].forEach(d => {
        calendar += `<div class="cal-header">${d}</div>`;
    });
    for (let i = 0; i < firstDay; i++) calendar += '<div class="cal-day empty"></div>';
    for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${displayYear}-${String(displayMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        let cls = 'cal-day';
        if (dateStr === today()) cls += ' today';
        if (periodDays.includes(dateStr)) cls += ' period';
        if (state.periodStart === dateStr) cls += ' period-start';
        if (predictedDays.includes(dateStr) && !periodDays.includes(dateStr)) cls += ' predicted';
        calendar += `<div class="${cls}" onclick="setPeriodDate('${dateStr}')">${d}</div>`;
    }

    let nextPeriod = '未设置';
    if (state.periodStart) {
        const next = new Date(state.periodStart);
        next.setDate(next.getDate() + state.periodCycle);
        nextPeriod = next.toLocaleDateString('zh-CN', {month:'short', day:'numeric'});
    }

    return `
        <div class="card">
            <div class="card-title">🌸 经期记录</div>
            <div class="cal-nav">
                <button onclick="prevMonth()">◀</button>
                <span class="cal-month">${displayYear}年${displayMonth+1}月</span>
                <button onclick="nextMonth()">▶</button>
            </div>
            <div class="period-calendar">${calendar}</div>
            <div class="period-info">
                <div class="period-info-item">
                    <div class="period-info-value">${nextPeriod}</div>
                    <div class="period-info-label">预估下次经期</div>
                </div>
                <div class="period-info-item">
                    <div class="period-info-value">${state.periodCycle}天</div>
                    <div class="period-info-label">周期长度</div>
                </div>
                <div class="period-info-item">
                    <div class="period-info-value">${state.periodDuration}天</div>
                    <div class="period-info-label">经期天数</div>
                </div>
            </div>
        </div>
        <div class="card">
            <div class="card-title">📝 设置经期信息</div>
            <div class="period-form">
                <div>
                    <label>开始日期</label>
                    <input type="date" id="periodStartInput" value="${state.periodStart}">
                </div>
                <div>
                    <label>结束日期</label>
                    <input type="date" id="periodEndInput" value="${state.periodEnd}">
                </div>
                <div>
                    <label>周期（天）</label>
                    <input type="number" id="periodCycleInput" value="${state.periodCycle}" min="20" max="45">
                </div>
                <div>
                    <label>经期天数</label>
                    <input type="number" id="periodDurationInput" value="${state.periodDuration}" min="2" max="10">
                </div>
                <div style="grid-column:1/-1;">
                    <label>今日备注（身体感受等）</label>
                    <textarea id="periodNoteInput" placeholder="例：腰酸、腹痛、心情烦躁...">${state.periodNotes[today()]||''}</textarea>
                </div>
            </div>
            <button class="btn-add" onclick="savePeriodInfo()">💾 保存信息</button>
        </div>
    `;
}

function prevMonth() { calOffset--; renderPage(); }
function nextMonth() { calOffset++; renderPage(); }

function getPeriodDays() {
    if (!state.periodStart || !state.periodEnd) return [];
    const start = new Date(state.periodStart);
    const end = new Date(state.periodEnd);
    const days = [];
    for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
        days.push(d.toISOString().slice(0,10));
    }
    return days;
}

function getPredictedPeriodDays() {
    if (!state.periodStart) return [];
    const predictions = [];
    for (let offset = 1; offset <= 3; offset++) {
        const start = new Date(state.periodStart);
        start.setDate(start.getDate() + state.periodCycle * offset);
        for (let i = 0; i < state.periodDuration; i++) {
            const d = new Date(start);
            d.setDate(d.getDate() + i);
            predictions.push(d.toISOString().slice(0,10));
        }
    }
    return predictions;
}

function setPeriodDate(date) {
    if (!state.periodStart || state.periodEnd) {
        state.periodStart = date;
        state.periodEnd = '';
        showToast('已设置经期开始日，请再选择结束日');
    } else {
        state.periodEnd = date;
        showToast('经期记录已更新 ✅');
    }
    renderPage();
}

function savePeriodInfo() {
    state.periodStart = $('periodStartInput').value;
    state.periodEnd = $('periodEndInput').value;
    state.periodCycle = parseInt($('periodCycleInput').value) || 28;
    state.periodDuration = parseInt($('periodDurationInput').value) || 5;
    const note = $('periodNoteInput').value.trim();
    if (note) state.periodNotes[today()] = note;
    renderPage();
    showToast('经期信息已保存 ✅');
}

function toggleMedicine(idx) {

    } else {

        m.streak = (m.streak || 0) + 1;

    renderPage();
}

function toggleFitness(key) {
    state.fitnessWeek = state.fitnessWeek || {};
    if (state.fitnessWeek[key]) {
        delete state.fitnessWeek[key];
        state.fitnessTotal = Math.max(0, (state.fitnessTotal||0) - 1);
    } else {
        state.fitnessWeek[key] = true;
        state.fitnessTotal = (state.fitnessTotal||0) + 1;
    }
    // 计算连续天数
    let streak = 0;
    for (let i = 0; i < 30; i++) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const key = d.toISOString().slice(0,10);
        if (state.fitnessWeek[key]) streak++;
        else break;
    }
    state.fitnessStreak = streak;
    renderPage();
}

function addFitnessRecord() {
    const input = $('fitnessInput');
    const text = input.value.trim();
    if (!text) return showToast('请输入训练内容', 'error');
    state.fitnessRecords = state.fitnessRecords || [];
    state.fitnessRecords.unshift({ content: text, date: today() });
    input.value = '';
    renderPage();
    showToast('训练记录已保存 💪');
}

function syncFitness() {
    showToast('☁️ 已同步到云端（演示）');
}

// ========== 每日记账 ==========
function renderAccount(container) {
    const expenses = state.accounts.filter(a => a.type === 'expense');
    const incomes = state.accounts.filter(a => a.type === 'income');
    const totalExp = expenses.reduce((s, a) => s + a.amount, 0);
    const totalInc = incomes.reduce((s, a) => s + a.amount, 0);
    const balance = totalInc - totalExp;

    const categories = {
        expense: ['🍜 餐饮', '🚌 交通', '🛒 购物', '🎬 娱乐', '📱 通讯', '💊 医疗', '📚 学习', '🏠 住房', '👔 服饰', '🐱 宠物', '🎁 礼物', '📦 其他'],
        income: ['💼 工资', '📈 投资', '🎯 奖金', '💰 兼职', '🎁 红包', '📦 其他']
    };

    // 分类统计
    const catStats = {};
    expenses.forEach(a => {
        const parts = a.category.split(' ');
        const cat = parts.length > 1 ? parts[1] : a.category;
        catStats[cat] = (catStats[cat] || 0) + a.amount;
    });
    const catEntries = Object.entries(catStats).sort((a,b) => b[1]-a[1]);
    const catColors = ['#f87171','#fb923c','#fbbf24','#4ade80','#60a5fa','#a78bfa','#f472b6','#2dd4bf','#94a3b8','#fb923c','#fbbf24','#4ade80'];
    const maxCat = catEntries.length > 0 ? catEntries[0][1] : 1;

    // 近7天趋势
    const trend = [];
    for (let i = 6; i >= 0; i--) {
        const d = new Date();
        d.setDate(d.getDate() - i);
        const key = d.toISOString().slice(0,10);
        const dayExp = expenses.filter(a => a.date === key).reduce((s,a) => s+a.amount, 0);
        const dayInc = incomes.filter(a => a.date === key).reduce((s,a) => s+a.amount, 0);
        trend.push({ label: (d.getMonth()+1) + '/' + d.getDate(), exp: dayExp, inc: dayInc });
    }
    const maxTrend = Math.max(...trend.map(t => Math.max(t.exp, t.inc)), 1);

    // 餐饮预算
    const foodThisMonth = expenses.filter(a => a.category.includes('餐饮')).reduce((s,a) => s+a.amount, 0);
    const foodBudget = 600;
    const foodPct = Math.round(foodThisMonth / foodBudget * 100);

    container.innerHTML = `
        <div class="page-header">
            <h2>🧾 每日记账</h2>
            <p>每一笔都清清楚楚</p>
        </div>
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-value" style="color:var(--accent-green);">¥${formatMoney(totalInc)}</div>
                <div class="stat-label">总收入</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" style="color:var(--accent-red);">¥${formatMoney(totalExp)}</div>
                <div class="stat-label">总支出</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" style="color:var(--accent-blue);">¥${formatMoney(balance)}</div>
                <div class="stat-label">结余</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" style="color:${foodPct>100?'var(--accent-red)':'var(--accent-orange)'};font-size:16px;">${foodPct}%</div>
                <div class="stat-label">餐饮预算</div>
            </div>
        </div>
        <div class="account-tabs">
            <button class="account-tab ${state.accountType==='expense'?'active':''}" onclick="state.accountType='expense';renderPage()">💸 支出</button>
            <button class="account-tab ${state.accountType==='income'?'active':''}" onclick="state.accountType='income';renderPage()">💵 收入</button>
        </div>
        <div class="card">
            <div class="card-title">${state.accountType==='expense'?'➖ 记一笔支出':'➕ 记一笔收入'}</div>
            <div class="account-form">
                <input type="number" id="accAmount" placeholder="金额" step="0.01" min="0">
                <select id="accCategory">
                    ${categories[state.accountType].map(c => `<option value="${c}">${c}</option>`).join('')}
                </select>
                <input type="text" id="accNote" placeholder="备注（选填）">
                <button class="btn-add" onclick="addAccount()">✅ 记录</button>
            </div>
        </div>

            <div class="card-title">📊 支出分类占比</div>
            ${catEntries.length === 0 ? '<p style="color:var(--text-muted);text-align:center;padding:12px;">暂无支出数据</p>' :
            catEntries.map(([cat, amt], i) => `
                <div style="margin-bottom:10px;">
                    <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;">
                        <span>${cat}</span>
                        <span style="color:var(--text-muted);">¥${formatMoney(amt)} (${Math.round(amt/totalExp*100)}%)</span>
                    </div>
                    <div style="height:8px;background:var(--hover-bg);border-radius:4px;overflow:hidden;">
                        <div style="height:100%;width:${amt/maxCat*100}%;background:${catColors[i%catColors.length]};border-radius:4px;transition:all 0.5s;"></div>
                    </div>
                </div>
            `).join('')}
        </div>
        <div class="card">
            <div class="card-title">📈 近7天收支趋势</div>
            <div style="display:flex;align-items:flex-end;gap:14px;height:130px;padding:10px 0;">
                ${trend.map(t => `
                    <div style="flex:1;text-align:center;">
                        <div style="display:flex;flex-direction:column;align-items:center;gap:2px;height:110px;justify-content:flex-end;">
                            ${t.inc>0?`<div style="width:100%;background:var(--accent-green);border-radius:3px;height:${t.inc/maxTrend*100}px;min-height:2px;font-size:9px;color:var(--bg-dark);display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px;">${t.inc>0?formatMoney(t.inc):''}</div>`:'<div style="height:0;"></div>'}
                            ${t.exp>0?`<div style="width:100%;background:var(--accent-red);border-radius:3px;height:${t.exp/maxTrend*100}px;min-height:2px;font-size:9px;color:white;display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px;">${t.exp>0?formatMoney(t.exp):''}</div>`:'<div style="height:0;"></div>'}

        </div>

            <div class="card-title">📋 最近记录</div>

                ${state.accounts.length === 0 ? '<p style="color:var(--text-muted);text-align:center;padding:16px;">还没有记账记录</p>' :
                state.accounts.slice().reverse().slice(0, 20).map(a => {
                    const parts = a.category.split(' ');
                    const icon = parts[0] || '📦';
                    const name = parts.length > 1 ? parts[1] : a.category;
                    return `
                    <div class="account-item">
                        <div class="account-item-info">

                            <div>
                                <div class="account-item-name">${name}</div>
                                <div class="account-item-category">${a.note||a.date}</div>
                            </div>
                        </div>
                        <div class="account-item-amount ${a.type}">${a.type==='expense'?'-':'+'}${formatMoney(a.amount)}</div>
                    </div>
                    `;
                }).join('')}
            </div>
        </div>
    `;
}

function addAccount() {
    const amount = parseFloat($('accAmount').value);
    const category = $('accCategory').value;
    const note = $('accNote').value.trim();
    if (!amount || amount <= 0) return showToast('请输入有效金额', 'error');

            <div style="margin-bottom:14px;">
                <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;">
                    <span>💧 喝水</span><span style="color:var(--accent-blue);">${waterRate}%</span>
                </div>
                <div style="height:8px;background:var(--hover-bg);border-radius:4px;overflow:hidden;">
                    <div style="height:100%;width:${waterRate}%;background:var(--accent-blue);border-radius:4px;transition:all 0.5s;"></div>
                </div>
            </div>
            <div style="margin-bottom:14px;">
                <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;">
                    <span>🎓 学习</span><span style="color:var(--accent-purple);">${studyRate}%</span>
                </div>
                <div style="height:8px;background:var(--hover-bg);border-radius:4px;overflow:hidden;">
                    <div style="height:100%;width:${studyRate}%;background:var(--accent-purple);border-radius:4px;transition:all 0.5s;"></div>
                </div>
            </div>
            <div>
                <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;">
                    <span>💰 存钱</span><span style="color:var(--accent-yellow);">${saveRate}%</span>
                </div>
                <div style="height:8px;background:var(--hover-bg);border-radius:4px;overflow:hidden;">
                    <div style="height:100%;width:${Math.min(saveRate,100)}%;background:var(--accent-yellow);border-radius:4px;transition:all 0.5s;"></div>
                </div>
            </div>
        </div>
        <div class="card">
            <div class="card-title">📝 月度复盘</div>
            <label style="font-size:13px;color:var(--text-secondary);display:block;margin-bottom:8px;">📖 本月总结</label>
            <textarea class="review-textarea" id="reviewSummary" style="min-height:80px;">${review.summary}</textarea>
            <label style="font-size:13px;color:var(--text-secondary);display:block;margin:16px 0 8px;">✅ 成就与亮点</label>
            <textarea class="review-textarea" id="reviewAchievements" style="min-height:80px;">${review.achievements}</textarea>
            <label style="font-size:13px;color:var(--text-secondary);display:block;margin:16px 0 8px;">🔧 需要改进</label>
            <textarea class="review-textarea" id="reviewImprovements" style="min-height:80px;">${review.improvements}</textarea>
            <label style="font-size:13px;color:var(--text-secondary);display:block;margin:16px 0 8px;">🎯 下月计划</label>
            <textarea class="review-textarea" id="reviewNextMonth" style="min-height:80px;">${review.nextMonth}</textarea>
            <div style="margin-top:20px;text-align:right;">
                <button class="btn-add" onclick="saveReview()">💾 保存复盘</button>
            </div>
        </div>
        ${histKeys.length > 0 ? `
        <div class="card">
            <div class="card-title">📚 历史复盘</div>
            ${histKeys.map(key => {
                const r = state.reviews[key];
                const [y, m] = key.split('-');
                return `
                <div style="padding:14px;background:var(--hover-bg);border-radius:var(--radius);margin-bottom:8px;cursor:pointer;" onclick="loadHistoryReview('${key}')">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                        <span style="font-size:14px;font-weight:600;">📅 ${y}年${parseInt(m)}月复盘</span>
                        <span style="font-size:11px;color:var(--text-muted);">点击查看</span>
                    </div>
                    ${r.summary ? `<div style="font-size:12px;color:var(--text-muted);line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">${r.summary.replace(/\n/g,' ')}</div>` : ''}
                </div>
                `;
            }).join('')}
        </div>` : ''}
    `;
}

function saveReview() {
    const now = new Date();
    const monthKey = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
    state.reviews[monthKey] = {
        summary: $('reviewSummary').value.trim(),
        achievements: $('reviewAchievements').value.trim(),
        improvements: $('reviewImprovements').value.trim(),
        nextMonth: $('reviewNextMonth').value.trim(),
    };
    renderPage();
    showToast('月度复盘已保存 ✅');
}

function loadHistoryReview(key) {
    const r = state.reviews[key];
    if (!r) return;
    $('reviewSummary').value = r.summary || '';
    $('reviewAchievements').value = r.achievements || '';
    $('reviewImprovements').value = r.improvements || '';
    $('reviewNextMonth').value = r.nextMonth || '';
    $('reviewSummary').focus();
    showToast(`已加载 ${key.replace('-','年')}月 复盘，可编辑后保存`);
}

// ========== AI学习打卡 ==========
function renderStudy(container) {
    const todayKey = today();
    const todayHours = state.studyRecords[todayKey] || 0;
    const allDays = Object.keys(state.studyRecords).length;
    const totalHours = Object.values(state.studyRecords).reduce((s,h) => s+h, 0);
    const avgHours = allDays > 0 ? (totalHours/allDays).toFixed(1) : 0;

    // 学习日历
    const todayDate = new Date();
    const year = todayDate.getFullYear();
    const month = todayDate.getMonth();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const firstDay = new Date(year, month, 1).getDay();

    let calHtml = '<div class="study-calendar">';
    ['日','一','二','三','四','五','六'].forEach(d => {
        calHtml += `<div class="cal-header">${d}</div>`;
    });
    for (let i = 0; i < firstDay; i++) calHtml += '<div class="study-cal-day empty"></div>';
    for (let d = 1; d <= daysInMonth; d++) {
        const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const hours = state.studyRecords[dateStr] || 0;
        let cls = 'study-cal-day' + (hours > 0 ? ' studied' : '');
        if (dateStr === todayKey) cls += ' today';
        calHtml += `<div class="${cls}">${d}${hours>0?`<span class="study-hours">${hours}h</span>`:''}</div>`;
    }
    calHtml += '</div>';

    // 每周分布
    const weekDist = [0,0,0,0,0,0,0];
    Object.entries(state.studyRecords).forEach(([k,v]) => {
        const d = new Date(k);
        if (!isNaN(d)) weekDist[d.getDay()] += v;
    });
    const maxWeek = Math.max(...weekDist, 1);
    const weekNames = ['周日','周一','周二','周三','周四','周五','周六'];

    // 技能树
    const skills = [
        { name: 'Python基础', pct: 80, color: '#60a5fa' },
        { name: '数据分析', pct: 55, color: '#4ade80' },
        { name: '机器学习', pct: 30, color: '#a78bfa' },
        { name: '深度学习', pct: 15, color: '#f472b6' },
        { name: 'NLP', pct: 20, color: '#fb923c' },
    ];

    const resources = [
        { type: '📖', title: '吴恩达《机器学习》课程', desc: '经典入门，配套作业用Python实现' },
        { type: '📖', title: '《动手学深度学习》李沐', desc: '理论+代码，适合有基础后系统学' },
        { type: '🎬', title: 'Kaggle Learn 微课程', desc: '每课30分钟，边学边练' },
        { type: '💻', title: 'LeetCode 热题100', desc: '算法基本功，面试必备' },
    ];

    container.innerHTML = `
        <div class="page-header">
            <h2>🎓 AI学习打卡</h2>
            <p>每天进步一点点，AI技能持续升级</p>
        </div>
        <div class="study-hero">
            <div class="study-hero-icon">🤖</div>
            <div class="study-hero-title">今日AI学习</div>
            <div class="study-hero-desc">记录你今天学习AI/编程的时长，坚持打卡提升技能</div>
            <div class="study-input-row">
                <input type="number" id="studyHours" placeholder="小时" min="0" max="24" step="0.5" value="${todayHours||''}">
                <span style="color:var(--text-muted);">小时</span>
                <button class="btn-add" onclick="saveStudy()">📝 打卡</button>
            </div>
            ${todayHours>0?`<p style="margin-top:12px;color:var(--accent-green);font-weight:600;">✅ 今日已打卡 ${todayHours} 小时</p>`:'<p style="margin-top:12px;color:var(--text-muted);font-size:13px;">今天还没打卡哦，快去学习吧～</p>'}
        </div>
        <div class="stats-row">
            <div class="stat-card">
                <div class="stat-value" style="color:var(--accent-blue);">${allDays}天</div>
                <div class="stat-label">累计学习天数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" style="color:var(--accent-green);">${totalHours.toFixed(1)}h</div>
                <div class="stat-label">累计学习时长</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" style="color:var(--accent-orange);">${avgHours}h</div>
                <div class="stat-label">日均学习</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" style="color:var(--accent-purple);">${allDays>0?Math.round(totalHours/24):0}天</div>
                <div class="stat-label">相当于全日制</div>
            </div>
        </div>
        <div class="card">
            <div class="card-title">📅 学习日历</div>
            ${calHtml}
        </div>
        <div class="card">
            <div class="card-title">📊 每周学习分布</div>
            <div style="display:flex;align-items:flex-end;gap:12px;height:120px;padding:10px 0;">
                ${weekDist.map((h,i) => `
                    <div style="flex:1;text-align:center;">
                        <div style="height:${h/maxWeek*90}px;background:linear-gradient(180deg,var(--accent-purple),var(--accent-blue));border-radius:6px 6px 0 0;min-height:2px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px;">
                            ${h>0?`<span style="font-size:10px;color:white;font-weight:600;">${h}h</span>`:''}
                        </div>
                        <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">${weekNames[i].slice(1)}</div>
                    </div>
                `).join('')}
            </div>
        </div>
        <div class="card">
            <div class="card-title">🌳 技能树</div>
            ${skills.map(s => `
                <div style="margin-bottom:12px;">
                    <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px;">
                        <span>${s.name}</span>
                        <span style="color:var(--text-muted);">${s.pct}%</span>
                    </div>
                    <div style="height:10px;background:var(--hover-bg);border-radius:5px;overflow:hidden;">
                        <div style="height:100%;width:${s.pct}%;background:${s.color};border-radius:5px;transition:all 0.5s;"></div>
                    </div>
                </div>
            `).join('')}
        </div>
        <div class="card">
            <div class="card-title">📚 推荐学习资源</div>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;">
                ${resources.map(r => `
                    <div style="padding:14px;background:var(--hover-bg);border-radius:var(--radius);cursor:pointer;transition:all 0.2s;" onclick="showToast('📖 ${r.title}')">
                        <div style="font-size:15px;margin-bottom:6px;">${r.type} ${r.title}</div>
                        <div style="font-size:12px;color:var(--text-muted);line-height:1.5;">${r.desc}</div>
                    </div>
                `).join('')}
            </div>
        </div>
        <div class="card">
            <div class="card-title">🧠 训练AI智能</div>
            <p style="color:var(--text-secondary);font-size:14px;line-height:1.8;margin-bottom:16px;">
                通过每日打卡记录，系统会学习你的学习节奏和习惯，未来可以为你：
            </p>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;">
                <div style="padding:14px;background:var(--hover-bg);border-radius:var(--radius);">
                    <div style="font-size:20px;margin-bottom:6px;">📊</div>
                    <div style="font-size:13px;font-weight:600;margin-bottom:4px;">学习分析</div>
                    <div style="font-size:12px;color:var(--text-muted);">分析你的学习高峰时段和效率</div>
                </div>
                <div style="padding:14px;background:var(--hover-bg);border-radius:var(--radius);">
                    <div style="font-size:20px;margin-bottom:6px;">🔔</div>
                    <div style="font-size:13px;font-weight:600;margin-bottom:4px;">智能提醒</div>
                    <div style="font-size:12px;color:var(--text-muted);">在你容易懈怠时推送鼓励</div>
                </div>
                <div style="padding:14px;background:var(--hover-bg);border-radius:var(--radius);">
                    <div style="font-size:20px;margin-bottom:6px;">🎯</div>
                    <div style="font-size:13px;font-weight:600;margin-bottom:4px;">个性化目标</div>
                    <div style="font-size:12px;color:var(--text-muted);">根据你的进度推荐学习路径</div>
                </div>
            </div>
            <div style="margin-top:16px;text-align:center;">
                <button class="btn-add" onclick="trainAI()" style="background:linear-gradient(135deg,var(--accent-purple),var(--accent-blue));">🚀 训练AI模型</button>
            </div>
        </div>
    `;
}

function saveStudy() {
    const hours = parseFloat($('studyHours').value);
    if (isNaN(hours) || hours < 0) return showToast('请输入有效时长', 'error');
    state.studyRecords[today()] = hours;
    renderPage();
    showToast(`打卡成功！今日学习 ${hours} 小时 🎉`);
}

function trainAI() {
    showToast('🧠 AI模型训练中...（演示功能）');
}

// ========== 模态框 ==========
function closeModal() {
    $('modalOverlay').classList.remove('show');
}

// ========== 初始化 ==========
function init() {
    loadState();
    renderNav();
    renderPage();

    // 键盘快捷键
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeModal();
    });

    // 点击遮罩关闭
    $('modalOverlay').addEventListener('click', (e) => {
        if (e.target === $('modalOverlay')) closeModal();
    });
}

init();
</script>
</body>
</html>
